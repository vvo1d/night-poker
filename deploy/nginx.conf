# Сайт для nginx. Класть в /etc/nginx/sites-available/night-poker
# и включать ссылкой в /etc/nginx/sites-enabled/
server {
    listen 80;
    listen [::]:80;
    server_name 146.158.123.214;

    # Состояние стола приходит потоком Server-Sent Events. Его нельзя буферизовать
    # и нельзя закрывать по таймауту, иначе игра будет замирать.
    location /api/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
    }

    # Показатели сервера наружу отдавать незачем.
    location /api/health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
    }
}
