# Сайт для nginx. Класть в /etc/nginx/sites-available/night-poker
# и включать ссылкой в /etc/nginx/sites-enabled/
# После certbot (HTTPS) включите HTTP/2 в блоке с listen 443: `http2 on;`
# (или `listen 443 ssl http2;` в nginx старше 1.25.1). Без него браузер держит
# к сайту не больше 6 соединений на все вкладки, а поток игры занимает по одному
# на вкладку — при нескольких открытых вкладках страницы перестают грузиться.
server {
    listen 80;
    listen [::]:80;
    server_name thpoker.ru www.thpoker.ru;

    # Сжатие страниц и стилей: быстрая загрузка — это и удобство, и позиции в поиске.
    # Поток событий ниже сжимать нельзя, там gzip выключен отдельно.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json
               application/xml application/manifest+json image/svg+xml text/plain;

    # Состояние стола приходит потоком Server-Sent Events. Его нельзя буферизовать
    # и нельзя закрывать по таймауту, иначе игра будет замирать.
    location /api/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
    }

    # Показатели сервера наружу отдавать незачем.
    location /api/health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
    }
}
